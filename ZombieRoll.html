<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zombie Roll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Garante que eventos de toque funcionem bem em dispositivos móveis */
            touch-action: manipulation;
        }
        .font-creepster {
            font-family: 'Creepster', cursive;
        }
        .dice {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .dice-placeholder {
            border: 2px dashed rgba(255,255,255,0.2);
        }
        .btn-zombie {
            transition: all 0.2s ease-in-out;
        }
        .btn-zombie:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-zombie:active {
            transform: translateY(0);
        }
        .modal-backdrop {
            background-color: rgba(0,0,0,0.75);
        }
        .modal-content {
            animation: slide-up 0.4s ease-out;
        }
        @keyframes slide-up {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes roll-anim {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(0.9); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .rolling {
            animation: roll-anim 0.5s ease-in-out;
        }
        /* Efeito para o dado transformado pelo energético */
        @keyframes transform-glow {
            0% { box-shadow: 0 0 5px rgba(192, 132, 252, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 20px rgba(192, 132, 252, 1), 0 0 25px rgba(167, 139, 250, 0.8); transform: scale(1.1); }
            100% { box-shadow: 0 0 5px rgba(192, 132, 252, 0.5); transform: scale(1); }
        }
        .transformed-brain {
            animation: transform-glow 0.8s ease-in-out;
        }
        
        /* Efeito para o dado revertido pela Colheita */
        @keyframes transform-revert {
            0% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 20px rgba(251, 191, 36, 1), 0 0 25px rgba(245, 158, 11, 0.8); transform: scale(1.1); }
            100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); transform: scale(1); }
        }
        .reverted-shot {
            animation: transform-revert 0.8s ease-in-out;
        }

        /* Efeito para o Rastro de Morte */
        @keyframes transform-death {
            0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 1), 0 0 25px rgba(220, 38, 38, 0.8); transform: scale(1.1); }
            100% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.5); transform: scale(1); }
        }
        .death-trail-brain {
            animation: transform-death 0.8s ease-in-out;
        }


        /* Cor do dado de ônibus */
        .bg-bus-die {
            background: linear-gradient(145deg, #4B0082, #8A2BE2);
            color: white;
            border: 1px solid #c084fc;
        }

        /* NOVO: Modal de Mensagem Rápida */
        .message-modal-content {
            animation: slide-up 0.4s ease-out, fade-out 0.5s ease-in 2.5s forwards;
        }
        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- Container para centralizar a tela de configuração inicial -->
    <div id="setup-container" class="min-h-screen flex items-center justify-center p-4">
        <!-- ... (código da tela de setup inalterado) ... -->
        <div id="setup-screen" class="w-full max-w-md mx-auto p-6 md:p-8 bg-gray-800 rounded-2xl shadow-2xl modal-content">
            <h1 class="font-creepster text-5xl sm:text-6xl text-center text-green-400 drop-shadow-[0_2px_2px_rgba(0,0,0,0.5)]">Zombie Roll</h1>
            <p class="text-center text-gray-400 mt-2 mb-6">Quantos zumbis famintos vão jogar?</p>
            
            <div class="mb-4">
                <label for="player-count" class="block mb-2 text-sm font-medium text-gray-300">Número de Jogadores</label>
                <select id="player-count" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5">
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
            </div>
            
            <div id="player-names-container" class="space-y-3 mb-6"></div>
            
            <button id="start-game-btn" class="w-full btn-zombie bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg">Começar a Caçada!</button>
        </div>
    </div>


    <!-- Tela Principal do Jogo -->
    <div id="game-screen" class="hidden w-full min-h-screen flex flex-col p-2 sm:p-4 md:p-6 lg:p-8">
        <!-- ... (código do header e placar inalterado) ... -->
        <header class="flex flex-wrap justify-between items-center gap-4 mb-4">
            <div>
                <h1 class="font-creepster text-4xl sm:text-5xl text-green-400">Zombie Roll</h1>
                <p id="turn-info" class="text-base sm:text-lg text-gray-300">Turno de: <span id="current-player-name" class="font-bold text-white"></span></p>
            </div>
            <div id="scoreboard" class="w-full sm:w-auto bg-gray-800 rounded-lg p-2 sm:p-3 flex gap-2 sm:gap-4 text-sm overflow-x-auto">
                <!-- Scores dos jogadores serão inseridos aqui -->
            </div>
        </header>

        <main class="flex-grow grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
            <!-- Coluna do Turno -->
            <div class="lg:col-span-1 bg-gray-800 rounded-2xl p-4 sm:p-6 flex flex-col">
                 <!-- ... (código da coluna de pontos inalterado) ... -->
                <h2 class="text-xl sm:text-2xl font-bold mb-4 text-center">Pontos do Turno</h2>
                <div class="flex-grow flex flex-row lg:flex-col justify-around items-center gap-6">
                    <!-- Placar de Cérebros -->
                    <div class="text-center">
                        <div id="turn-brains-icon" class="w-16 h-16 sm:w-20 sm:h-20 mx-auto flex items-center justify-center text-5xl sm:text-6xl"></div>
                        <p id="turn-brains-score" class="text-3xl sm:text-4xl font-bold mt-2">0</p>
                        <p class="text-gray-400">Cérebros</p>
                    </div>
                    <!-- Placar de Tiros -->
                    <div class="text-center">
                        <div id="turn-shots-icon" class="w-16 h-16 sm:w-20 sm:h-20 mx-auto flex items-center justify-center text-5xl sm:text-6xl"></div>
                        <p id="turn-shots-score" class="text-3xl sm:text-4xl font-bold mt-2">0</p>
                         <p class="text-gray-400">Tiros</p>
                    </div>
                </div>
                 <div id="dice-cup-info" class="text-center mt-6 text-gray-400">
                    Dados no copo: <span id="dice-cup-count" class="font-bold text-white">16</span>
                 </div>
            </div>

            <!-- Coluna de Rolagem -->
            <div class="lg:col-span-2 bg-gray-800/50 rounded-2xl p-4 sm:p-6 flex flex-col justify-between">
                <div>
                     <h2 class="text-xl sm:text-2xl font-bold mb-6 text-center">Dados Rolados</h2>
                     <div id="dice-area" class="grid grid-cols-3 gap-2 sm:gap-4 min-h-[100px] sm:min-h-[120px]">
                         <!-- Dados rolados aparecem aqui -->
                     </div>
                </div>
                <div class="mt-6 text-center">
                    <p id="game-message" class="min-h-[2rem] text-base sm:text-lg text-yellow-300 mb-4"></p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center flex-wrap">
                        <button id="roll-btn" class="btn-zombie bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg text-lg flex-grow sm:flex-grow-0">Rolar Dados</button>
                        <button id="bus-btn" class="hidden btn-zombie bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg text-lg flex-grow sm:flex-grow-0">Entrar no Ônibus</button>
                        <button id="stop-btn" class="btn-zombie bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg text-lg flex-grow sm:flex-grow-0">Parar Turno</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div id="game-over-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-40">
        <!-- ... (código do modal inalterado) ... -->
        <div class="modal-content bg-gray-800 rounded-2xl shadow-2xl p-8 text-center max-w-sm w-full">
            <h2 class="font-creepster text-5xl text-green-400 mb-2">Fim de Jogo!</h2>
            <p id="winner-message" class="text-xl mb-6"></p>
            <button id="play-again-btn" class="w-full btn-zombie bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg">Jogar Novamente</button>
        </div>
    </div>
    
    <!-- NOVO: Modal de Mensagem Rápida -->
    <div id="message-modal" class="hidden fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50">
        <div class="message-modal-content bg-gray-800 rounded-2xl shadow-2xl p-8 text-center max-w-sm w-full">
            <h2 id="message-modal-title" class="font-creepster text-5xl text-red-500 mb-2">---</h2>
            <p id="message-modal-text" class="text-xl mb-6"></p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- ELEMENTOS DO DOM ---
            const setupContainer = document.getElementById('setup-container');
            const gameScreen = document.getElementById('game-screen');
            const playerCountSelect = document.getElementById('player-count');
            const playerNamesContainer = document.getElementById('player-names-container');
            const startGameBtn = document.getElementById('start-game-btn');
            
            const currentPlayerNameEl = document.getElementById('current-player-name');
            const scoreboardEl = document.getElementById('scoreboard');
            const turnBrainsScoreEl = document.getElementById('turn-brains-score');
            const turnShotsScoreEl = document.getElementById('turn-shots-score');
            const diceCupCountEl = document.getElementById('dice-cup-count');
            const diceAreaEl = document.getElementById('dice-area');
            const gameMessageEl = document.getElementById('game-message');
            const rollBtn = document.getElementById('roll-btn');
            const busBtn = document.getElementById('bus-btn');
            const stopBtn = document.getElementById('stop-btn');

            const gameOverModal = document.getElementById('game-over-modal');
            const winnerMessageEl = document.getElementById('winner-message');
            const playAgainBtn = document.getElementById('play-again-btn');

            // NOVO: Elementos do Modal de Mensagem
            const messageModal = document.getElementById('message-modal');
            const messageModalTitle = document.getElementById('message-modal-title');
            const messageModalText = document.getElementById('message-modal-text');


            // --- ÍCONES EMOJI ---
            const ICONS = {
                cerebro: '🧠',
                tiro: '💥',
                pegada: '👣',
                capacete: '⛑️',
                energetico: '⚡',
                'dois cerebros': '🧠🧠',
                'dois tiros': '💥💥',
                // ÍCONES DO ÔNIBUS
                'pare': '🛑',
                'colheita': '🔄',
                'rastro de morte': '💀',
                'atropelamento': '🚗',
                'cerebro+tiro': '🧠💥',
                'dois cerebros+tiro': '🧠🧠💥',
                'tres cerebros': '🧠🧠🧠',
            };
            
            document.getElementById('turn-brains-icon').textContent = ICONS.cerebro;
            document.getElementById('turn-shots-icon').textContent = ICONS.tiro;

            // --- ESTADO DO JOGO ---
            let gameState = {};

            // --- LÓGICA DO JOGO ---
            const DICE_FACES = {
                // ... (faces dos dados normais inalteradas) ...
                verde: ['cerebro', 'cerebro', 'cerebro', 'pegada', 'tiro', 'tiro'],
                amarelo: ['cerebro', 'cerebro', 'pegada', 'pegada', 'tiro', 'tiro'],
                vermelho: ['cerebro', 'pegada', 'pegada', 'tiro', 'tiro', 'tiro'],
                rosa: ['cerebro', 'pegada', 'pegada', 'pegada', 'tiro', 'tiro'],
                branco: ['pegada', 'pegada', 'pegada', 'dois cerebros', 'dois tiros', 'tiro'],
                'papai noel': ['cerebro', 'pegada', 'tiro', 'dois cerebros', 'capacete', 'energetico']
            };

            // DADO DE ÔNIBUS (12 LADOS)
            const BUS_DIE_FACES = [
                'pare',             // 1
                'colheita',         // 2
                'cerebro',          // 3
                'cerebro+tiro',     // 4
                'rastro de morte',  // 5
                'dois tiros',       // 6
                'tres cerebros',    // 7
                'dois cerebros+tiro', // 8
                'dois cerebros',    // 9
                'atropelamento',    // 10
                'tiro',             // 11
                'cerebro'           // 12

            ];
            
            const DICE_COLORS = {
                // ... (cores dos dados normais inalteradas) ...
                verde: 'bg-green-500',
                amarelo: 'bg-yellow-400',
                vermelho: 'bg-red-600',
                rosa: 'bg-pink-400',
                branco: 'bg-gray-100',
                'papai noel': 'bg-gradient-to-br from-red-500 to-white'
            };

            function createDiceCup() {
                // ... (função inalterada) ...
                return [
                    ...Array(6).fill('verde'), ...Array(4).fill('amarelo'),
                    ...Array(3).fill('vermelho'), 'rosa', 'branco', 'papai noel'
                ];
            }

            function shuffle(array) {
                // ... (função inalterada) ...
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // NOVA FUNÇÃO
            function rollBusDie() {
                return BUS_DIE_FACES[Math.floor(Math.random() * 12)];
            }
            
            function updatePlayerNames() {
                // ... (função inalterada) ...
                const count = parseInt(playerCountSelect.value);
                playerNamesContainer.innerHTML = '';
                for (let i = 0; i < count; i++) {
                    playerNamesContainer.innerHTML += `
                        <div class="flex items-center gap-2">
                            <span class="text-gray-400">🧟</span>
                            <input type="text" placeholder="Nome do Jogador ${i + 1}" class="player-name-input bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-green-500 focus:border-green-500 block w-full p-2.5" required value="Jogador ${i + 1}">
                        </div>`;
                }
            }

            function initializeGame() {
                // ... (lógica de inicialização de jogadores inalterada) ...
                const playerInputs = document.querySelectorAll('.player-name-input');
                const players = Array.from(playerInputs).map((input, index) => ({
                    name: input.value || `Jogador ${index + 1}`,
                    score: 0
                }));

                gameState = {
                    players,
                    currentPlayerIndex: 0,
                    turn: 1,
                    diceCup: [],
                    turnState: {
                        brains: 0,
                        shots: 0,
                        footprintDice: [],
                        isEnergized: false,
                        isBusMode: false,     
                        isBusAvailable: true, 
                        isFirstRoll: true, // NOVO: Controla se é a primeira rolagem
                    },
                    isTurnOver: false,
                    lastPlayerIndex: players.length - 1, 
                    isFinalRound: false 
                };
                
                setupContainer.classList.add('hidden');
                gameScreen.classList.remove('hidden');
                gameScreen.classList.add('flex');

                startTurn();
            }
            
            function startTurn() {
                // Reseta o estado do turno, incluindo flags do ônibus
                gameState.turnState = { 
                    brains: 0, 
                    shots: 0, 
                    footprintDice: [], 
                    isEnergized: false, 
                    isBusMode: false,
                    isBusAvailable: true,
                    isFirstRoll: true // Reseta para a primeira rolagem
                };
                gameState.diceCup = shuffle(createDiceCup());
                gameState.isTurnOver = false;

                updateUI();
                renderDice([], null); // Limpa os dados
                rollBtn.disabled = false;
                stopBtn.disabled = false;
                
                // MODIFICADO: Botões são configurados manualmente no início
                busBtn.classList.add('hidden'); // Esconde o ônibus no início
                rollBtn.textContent = 'Rolar 3 Dados';
                
                gameMessageEl.textContent = `É a sua vez, ${gameState.players[gameState.currentPlayerIndex].name}!`;
            }

            // Função para alternar o modo ônibus
            function toggleBusMode() {
                if (!gameState.turnState.isBusAvailable) return; 

                // NOVO: Se está a SAIR do ônibus, torna-se permanente
                if (gameState.turnState.isBusMode) {
                    gameState.turnState.isBusAvailable = false; // Não pode voltar a entrar
                }

                gameState.turnState.isBusMode = !gameState.turnState.isBusMode;
                updateButtonLabels();
            }

            // Função para atualizar os textos e cores dos botões
            function updateButtonLabels() {
                // Se não for a primeira rolagem, mostra o botão do ônibus
                if (!gameState.turnState.isFirstRoll) {
                    if (gameState.turnState.isBusAvailable) {
                        busBtn.classList.remove('hidden'); 
                    } else {
                        busBtn.classList.add('hidden'); // Esconde se atropelado ou se já saiu
                    }
                } else {
                    busBtn.classList.add('hidden'); // Mantém escondido na primeira rolagem
                }

                if (gameState.turnState.isBusMode) {
                    rollBtn.textContent = 'Rolar (Ônibus)';
                    busBtn.textContent = 'Sair do Ônibus';
                    busBtn.classList.remove('bg-purple-600', 'hover:bg-purple-700');
                    busBtn.classList.add('bg-yellow-500', 'hover:bg-yellow-600', 'text-gray-900'); // Sair = Amarelo
                } else {
                    rollBtn.textContent = 'Rolar 3 Dados';
                    busBtn.textContent = 'Entrar no Ônibus';
                    busBtn.classList.add('bg-purple-600', 'hover:bg-purple-700');
                    busBtn.classList.remove('bg-yellow-500', 'hover:bg-yellow-600', 'text-gray-900'); // Entrar = Roxo
                }
                
                if (!gameState.turnState.isBusAvailable) {
                    busBtn.classList.add('hidden'); 
                    rollBtn.textContent = 'Rolar 3 Dados'; // Força rolar normal
                }
            }


            // MODIFICADA para não aceitar flag
            function rollDice() {
                if (gameState.isTurnOver) return;
                
                // NOVO: Marca que não é mais a primeira rolagem
                if (gameState.turnState.isFirstRoll) {
                    gameState.turnState.isFirstRoll = false;
                }
                
                rollBtn.disabled = true;
                stopBtn.disabled = true;
                busBtn.classList.add('hidden'); // Esconde o botão do ônibus durante a rolagem

                // Animação de rolar
                diceAreaEl.innerHTML = '';
                for (let i=0; i<3; i++) {
                     diceAreaEl.innerHTML += `
                         <div class="dice-placeholder h-20 sm:h-24 md:h-28 flex items-center justify-center rounded-lg rolling">
                             <div class="w-12 h-12 sm:w-16 sm:h-16 bg-gray-600 rounded-md animate-pulse"></div>
                         </div>`;
                }
                
                setTimeout(() => {
                    performRoll(); // performRoll agora lê o gameState.turnState.isBusMode
                    
                    rollBtn.disabled = false;
                    stopBtn.disabled = false;

                    if (gameState.isTurnOver) {
                        rollBtn.disabled = true;
                        stopBtn.disabled = true;
                        busBtn.classList.add('hidden');
                        setTimeout(nextPlayer, 2500);
                    } else {
                        updateButtonLabels(); // Atualiza os botões (mostrar/esconder/mudar texto)
                    }
                }, 800);
            }

            // MODIFICADA para ler o estado isBusMode
            function performRoll() {
                let diceToRoll = [];
                let diceResults = [];
                let busResult = null;
                let rollCount = 3; 

                if (gameState.turnState.isBusMode) { // Verifica se está no modo ônibus
                    busResult = rollBusDie();
                    rollCount = 2; // 1 ônibus + 2 dados

                    // Regra das 3 pegadas
                    if (gameState.turnState.footprintDice.length === 3) {
                        diceToRoll.push(gameState.turnState.footprintDice.pop());
                        diceToRoll.push(gameState.turnState.footprintDice.pop());
                        gameState.turnState.footprintDice = []; // Descarta a 3ª pegada
                    } else {
                        diceToRoll.push(...gameState.turnState.footprintDice);
                        gameState.turnState.footprintDice = [];
                    }
                } else {
                    // Rolagem normal (sem ônibus)
                    rollCount = 3;
                    diceToRoll.push(...gameState.turnState.footprintDice);
                    gameState.turnState.footprintDice = [];
                }
                
                const needed = rollCount - diceToRoll.length;
                
                if (gameState.diceCup.length < needed) {
                    gameMessageEl.textContent = "Não há dados suficientes! Re-embaralhando os usados...";
                    gameState.diceCup.push(...shuffle(createDiceCup()));
                }

                for(let i = 0; i < needed; i++) {
                    diceToRoll.push(gameState.diceCup.shift());
                }

                for (const color of diceToRoll) {
                    const faces = DICE_FACES[color];
                    const result = faces[Math.floor(Math.random() * faces.length)];
                    diceResults.push({ color, result });
                }
                
                // ATENÇÃO: Passa uma *cópia* de diceResults para processRollResults
                // para que possamos modificar a original (diceResults) dentro da lógica de atropelamento
                // e afetar o renderDice
                processRollResults([...diceResults], busResult, diceResults);
                updateUI();
                renderDice(diceResults, busResult); // Renderiza a 'diceResults' original (que pode ter sido modificada)
            }

            // MODIFICADA para aceitar 'originalResults' para manipulação
            function processRollResults(results, busResult = null, originalResults) {
                let currentRollMessage = [];
                let forceStop = false;
                let isDeathTrail = busResult === 'rastro de morte';

                if (busResult) {
                    currentRollMessage.push(`🚌 Ônibus: ${busResult}!`);
                    
                    if (busResult === 'colheita') {
                        results.forEach(item => {
                            if (item.result === 'tiro') {
                                item.result = 'pegada';
                                item.transformed = 'reverted'; // Flag para efeito visual
                            }
                        });
                    }
                }

                // Efeito Rastro de Morte (converte pegadas *antigas*)
                if (isDeathTrail) {
                    const oldPegs = gameState.turnState.footprintDice.length;
                    if (oldPegs > 0) {
                        gameState.turnState.brains += oldPegs;
                        currentRollMessage.push(`${oldPegs} pegadas antigas viraram cérebros!`);
                        gameState.turnState.footprintDice = []; // Limpa
                    }
                }

                // Processa energéticos
                if (results.some(item => item.result === 'energetico')) {
                    gameState.turnState.isEnergized = true;
                }
                if (gameState.turnState.isEnergized) {
                    results.forEach(item => {
                        if (item.color === 'verde' && item.result === 'pegada') {
                            item.result = 'cerebro'; 
                            item.transformed = 'brain'; // Flag para efeito visual
                        }
                    });
                }

                // Processa os dados normais
                for (const item of results) {
                    switch(item.result) {
                        case 'cerebro':
                            gameState.turnState.brains++;
                            currentRollMessage.push(item.transformed === 'brain' ? "pegada energizada" : "cérebro");
                            break;
                        case 'dois cerebros':
                            gameState.turnState.brains += 2;
                            currentRollMessage.push("dois cérebros");
                            break;
                        case 'tiro':
                            gameState.turnState.shots++;
                            currentRollMessage.push("tiro");
                            break;
                        case 'dois tiros':
                            gameState.turnState.shots += 2;
                            currentRollMessage.push("dois tiros");
                            break;
                        case 'capacete':
                            if (gameState.turnState.shots > 0) gameState.turnState.shots--;
                            currentRollMessage.push("capacete salvador");
                            break;
                        case 'energetico':
                            currentRollMessage.push("energético!");
                            break;
                        case 'pegada':
                            // Efeito Rastro de Morte (converte pegadas *novas*)
                            if (isDeathTrail && item.transformed !== 'reverted') {
                                item.result = 'cerebro';
                                item.transformed = 'death'; // Flag para efeito visual
                                gameState.turnState.brains++;
                                currentRollMessage.push("nova pegada virou cérebro");
                            } else {
                                // Lógica normal
                                gameState.turnState.footprintDice.push(item.color);
                                currentRollMessage.push(item.transformed === 'reverted' ? "tiro revertido" : "pegada");
                            }
                            break;
                    }
                }

                // Processa os efeitos do dado do ônibus (que não são de conversão)
                if (busResult && busResult !== 'colheita' && busResult !== 'rastro de morte') {
                    switch (busResult) {
                        case 'pare':
                            forceStop = true;
                            break;
                        case 'cerebro':
                            gameState.turnState.brains++;
                            break;
                        case 'cerebro+tiro':
                            gameState.turnState.brains++;
                            gameState.turnState.shots++;
                            break;
                        case 'dois tiros':
                            gameState.turnState.shots += 2;
                            break;
                        case 'tres cerebros':
                            gameState.turnState.brains += 3;
                            break;
                        case 'dois cerebros+tiro':
                            gameState.turnState.brains += 2;
                            gameState.turnState.shots++;
                            break;
                        case 'dois cerebros':
                            gameState.turnState.brains += 2;
                            break;
                        case 'atropelamento':
                            gameState.turnState.isBusAvailable = false; // Bloqueia o ônibus
                            gameState.turnState.isBusMode = false;      // Força a saída
                            currentRollMessage.push("Atropelado! Você foi ejetado do ônibus.");
                            
                            let lostBrain = false;
                            // let returnedDieColor = null; // REMOVIDO

                            // LÓGICA MODIFICADA: Verifica se tem 1 cérebro ou mais (em vez de > 1)
                            if (gameState.turnState.brains > 0) {
                                gameState.turnState.brains--;
                                lostBrain = true;
                                currentRollMessage.push("Perdeu 1 cérebro!");

                                // LÓGICA DE DEVOLVER DADO REMOVIDA
                            }
                            
                            // Chama a "animação" (modal) - Mensagem atualizada
                            showTemporaryMessage(
                                "ATROPELADO!", 
                                `Você foi ejetado! ${lostBrain ? "Perdeu 1 cérebro." : "Mas escapou sem perder cérebros!"}`
                            );
                            
                            break;
                        case 'tiro':
                            gameState.turnState.shots++;
                            break;
                    }
                }
                
                gameMessageEl.textContent = `Você conseguiu: ${currentRollMessage.join(', ')}!`;

                if (gameState.turnState.shots >= 3) {
                    gameState.isTurnOver = true;
                    gameState.turnState.brains = 0;
                    gameMessageEl.textContent = 'BOOM! Você levou 3 tiros e perdeu seus cérebros!';
                }

                if (forceStop && !gameState.isTurnOver) {
                     gameMessageEl.textContent = "O ônibus parou! Fim do turno.";
                     setTimeout(endTurn, 2000);
                }
            }
            
            // NOVO: Função para mostrar modal de mensagem
            function showTemporaryMessage(title, text) {
                messageModalTitle.textContent = title;
                messageModalText.textContent = text;
                messageModal.classList.remove('hidden');
                messageModal.classList.add('flex');

                // Esconde o modal e o backdrop após 3 segundos
                setTimeout(() => {
                    messageModal.classList.add('hidden');
                    messageModal.classList.remove('flex');
                }, 3000); // O modal vai sumir 0.5s antes por causa da animação fade-out
            }

            function endTurn() {
                // ... (lógica de fim de turno e rodada final inalterada) ...
                if(gameState.isTurnOver) {
                    nextPlayer();
                    return;
                }
                
                const brainsScored = gameState.turnState.brains;
                gameState.players[gameState.currentPlayerIndex].score += brainsScored;
                gameMessageEl.textContent = `Você marcou ${brainsScored} cérebro${brainsScored !== 1 ? 's' : ''}!`;
                
                rollBtn.disabled = true;
                stopBtn.disabled = true;
                busBtn.classList.add('hidden'); // Esconde o botão do ônibus
                
                const currentPlayer = gameState.players[gameState.currentPlayerIndex];

                if (currentPlayer.score >= 13 && !gameState.isFinalRound) {
                    gameState.isFinalRound = true;
                    gameMessageEl.textContent += " Rodada final ativada!";
                }

                if (gameState.isFinalRound && gameState.currentPlayerIndex === gameState.lastPlayerIndex) {
                    updateUI();
                    setTimeout(endGame, 2000);
                } else {
                    setTimeout(nextPlayer, 2000);
                }
            }

            function nextPlayer() {
                // ... (função inalterada) ...
                gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
                if (gameState.currentPlayerIndex === 0) {
                    gameState.turn++;
                }
                startTurn();
            }
            
            function endGame() {
                // ... (função inalterada) ...
                const winner = gameState.players.reduce((prev, current) => (prev.score > current.score) ? prev : current);
                
                winnerMessageEl.innerHTML = `<span class="font-bold text-white">${winner.name}</span> é o zumbi supremo com <span class="font-bold text-white">${winner.score}</span> cérebro${winner.score !== 1 ? 's' : ''}!`;
                gameOverModal.classList.remove('hidden');
                gameOverModal.classList.add('flex');
            }

            // --- FUNÇÕES DE RENDERIZAÇÃO ---
            function updateUI() {
                // ... (lógica de placar inalterada) ...
                const currentPlayer = gameState.players[gameState.currentPlayerIndex];
                currentPlayerNameEl.textContent = currentPlayer.name;
                
                scoreboardEl.innerHTML = '';
                gameState.players.forEach((player, index) => {
                    const isActive = index === gameState.currentPlayerIndex;
                    scoreboardEl.innerHTML += `
                        <div class="text-center p-2 rounded-md ${isActive ? 'bg-green-500/30' : ''} flex-shrink-0">
                            <p class="font-semibold truncate max-w-[80px] sm:max-w-[100px]">${player.name}</p>
                            <p class="text-xl font-bold">${player.score}</p>
                        </div>
                    `;
                });
                
                turnBrainsScoreEl.textContent = gameState.turnState.brains;
                turnShotsScoreEl.textContent = gameState.turnState.shots;
                diceCupCountEl.textContent = gameState.diceCup.length;
            }

            // MODIFICADA para renderizar o dado do ônibus e novo efeito
            function renderDice(results, busResult = null) {
                diceAreaEl.innerHTML = '';
                const diceSizeClass = 'h-20 sm:h-24 md:h-28';
                
                if ((!results || results.length === 0) && !busResult) {
                     for (let i=0; i<3; i++) {
                           diceAreaEl.innerHTML += `<div class="dice-placeholder ${diceSizeClass} rounded-lg"></div>`;
                     }
                    return;
                }

                // Renderiza o dado do ônibus primeiro, se houver
                if (busResult) {
                    const diceElement = document.createElement('div');
                    diceElement.className = `dice bg-bus-die ${diceSizeClass} flex items-center justify-center text-4xl sm:text-5xl md:text-6xl rounded-lg`;
                    diceElement.textContent = ICONS[busResult] || (ICONS[busResult.split('+')[0]] || busResult);
                    diceAreaEl.appendChild(diceElement);
                }

                // Renderiza os dados normais
                results.forEach(item => {
                    const diceColorClass = DICE_COLORS[item.color] || 'bg-gray-500';
                    const iconHTML = ICONS[item.result] || '';
                    
                    const diceElement = document.createElement('div');
                    diceElement.className = `dice ${diceColorClass} ${diceSizeClass} flex items-center justify-center text-4xl sm:text-5xl md:text-6xl rounded-lg`;
                    
                    if (item.transformed === 'brain') {
                        diceElement.classList.add('transformed-brain');
                    } else if (item.transformed === 'reverted') {
                        diceElement.classList.add('reverted-shot');
                    } else if (item.transformed === 'death') { // NOVO EFEITO
                        diceElement.classList.add('death-trail-brain');
                    }

                    diceElement.textContent = iconHTML;
                    diceAreaEl.appendChild(diceElement);
                });

                // Preencher com placeholders
                const totalDice = (busResult ? 1 : 0) + results.length;
                 for (let i = 0; i < 3 - totalDice; i++) {
                     diceAreaEl.innerHTML += `<div class="dice-placeholder ${diceSizeClass} rounded-lg"></div>`;
                 }
            }

            // --- EVENT LISTENERS ---
            playerCountSelect.addEventListener('change', updatePlayerNames);
            startGameBtn.addEventListener('click', initializeGame);
            
            // Modificados para os novos handlers
            rollBtn.addEventListener('click', rollDice); // Chama sem parâmetro
            busBtn.addEventListener('click', toggleBusMode); // Chama o alternador
            
            stopBtn.addEventListener('click', endTurn);
            playAgainBtn.addEventListener('click', () => {
                location.reload();
            });

            // --- INICIALIZAÇÃO ---
            updatePlayerNames();
        });
    </script>
</body>
</html>
